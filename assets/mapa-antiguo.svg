<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <style>
      .sea { fill: #c3d6d2; }
      .land { fill: #e6d7b3; }
      .river { stroke: #9fc2c9; stroke-width: 0.4; fill: none; }
      .label { font-family: Georgia, serif; fill: #6b4a2f; font-weight: 700; }
      .label-lg { font-size: 4.4px; }
      .label-md { font-size: 3.4px; }
    </style>
  </defs>

  <rect x="0" y="0" width="100" height="100" class="sea" />

  <!-- Asia Menor (north-west) -->
  <path d="M10,2 Q35,-2 55,8 Q45,18 25,16 Q10,14 10,2 Z" class="land" />
  <text x="30" y="10" class="label label-md" text-anchor="middle">ASIA MENOR</text>

  <!-- Egipto / Nilo (south-west) -->
  <path d="M20,45 Q35,42 40,55 Q42,75 35,95 Q20,95 15,80 Q12,60 20,45 Z" class="land" />
  <text x="26" y="70" class="label label-lg" text-anchor="middle">EGIPTO</text>
  <path d="M28,50 L30,95" class="river" />

  <!-- Sinaí -->
  <path d="M40,55 Q48,58 46,68 Q40,72 36,65 Q36,58 40,55 Z" class="land" />
  <text x="41" y="63" class="label label-md" text-anchor="middle">SINAÍ</text>

  <!-- Canaán / Israel / Judá / Galilea (centro) -->
  <path d="M45,22 Q56,20 58,35 Q60,55 52,58 Q42,55 42,38 Q42,28 45,22 Z" class="land" />
  <text x="50" y="35" class="label label-lg" text-anchor="middle">CANAÁN</text>
  <text x="50" y="41" class="label label-md" text-anchor="middle">(Israel · Judá)</text>

  <!-- Mesopotamia / Harán / Ur (north-east) -->
  <path d="M56,10 Q75,8 82,25 Q80,38 65,36 Q55,30 56,18 Q55,13 56,10 Z" class="land" />
  <text x="68" y="22" class="label label-lg" text-anchor="middle">MESOPOTAMIA</text>
  <text x="68" y="27" class="label label-md" text-anchor="middle">Ur · Harán</text>
  <path d="M60,12 Q66,25 70,40" class="river" />
  <path d="M75,12 Q78,25 78,40" class="river" />

  <!-- Babilonia -->
  <circle cx="70" cy="38" r="1.6" fill="#8a5a35" />
  <text x="70" y="34" class="label label-md" text-anchor="middle">BABILONIA</text>

  <!-- Persia (east) -->
  <path d="M78,30 Q95,28 96,50 Q92,62 80,58 Q75,45 78,30 Z" class="land" />
  <text x="85" y="46" class="label label-lg" text-anchor="middle">PERSIA</text>
  <text x="85" y="51" class="label label-md" text-anchor="middle">Susa</text>

  <!-- Grecia / Roma (far west, for context) -->
  <path d="M2,20 Q10,15 12,28 Q8,38 2,35 Q0,26 2,20 Z" class="land" />
  <text x="6" y="27" class="label label-md" text-anchor="middle">GRECIA</text>

  <!-- Mar Mediterráneo label -->
  <text x="30" y="18" class="label label-md" text-anchor="middle" fill="#4a6f6f">MAR MEDITERRÁNEO</text>

  <!-- Mar Rojo -->
  <path d="M38,72 Q42,82 38,95 L34,95 Q36,82 34,72 Z" fill="#a9c7cc" />
  <text x="38" y="88" class="label label-md" text-anchor="middle" fill="#4a6f6f" transform="rotate(80 38 88)">MAR ROJO</text>
</svg>
