<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body{margin:0;background:oklch(0.95 0.016 80);font-family:'Mulish',sans-serif;-webkit-font-smoothing:antialiased;}
    *{box-sizing:border-box;}
    a{color:oklch(0.42 0.09 255);text-decoration:none;}
    a:hover{color:oklch(0.34 0.1 255);}
  </style>
</helmet>

<div style="min-height:620px;background:oklch(0.95 0.016 80);display:flex;align-items:center;justify-content:center;padding:40px;">

  <div style="width:400px;background:oklch(0.97 0.01 80);border:1px solid oklch(0.82 0.02 70);border-radius:18px;box-shadow:0 3px 10px rgba(40,25,10,0.12);padding:34px 32px 26px;display:flex;flex-direction:column;gap:24px;">

    <div style="display:flex;flex-direction:column;gap:7px;">
      <div style="font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:oklch(0.48 0.02 55);font-weight:700;">Noche de adoración en familia</div>
      <div style="font-family:'Amiri',serif;font-size:27px;font-weight:700;color:oklch(0.26 0.03 50);line-height:1.1;">Personajes de la Biblia</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:3px;">
        <span style="display:inline-flex;color:{{ accent }};">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        </span>
        <span style="font-size:13px;font-weight:700;color:oklch(0.48 0.02 55);">Panel de tarjetas</span>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:14px;">
      <div style="display:flex;flex-direction:column;gap:6px;">
        <label style="font-size:10px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:oklch(0.48 0.02 55);">Usuario</label>
        <div style="height:40px;display:flex;align-items:center;background:oklch(0.99 0.005 80);border:1px solid oklch(0.82 0.02 70);border-radius:11px;padding:0 13px;font-size:13.5px;color:oklch(0.26 0.03 50);">eric</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <label style="font-size:10px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:oklch(0.48 0.02 55);">Contraseña</label>
        <div style="height:40px;display:flex;align-items:center;justify-content:space-between;background:oklch(0.99 0.005 80);border:1px solid {{ accent }};border-radius:11px;padding:0 13px;">
          <span style="font-size:15px;letter-spacing:0.22em;color:oklch(0.26 0.03 50);">••••••••••</span>
          <span style="display:inline-flex;color:oklch(0.48 0.02 55);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A9.6 9.6 0 0 1 12 5c5 0 9 4.5 9 7a12 12 0 0 1-2.2 3.2"/><path d="M6.6 6.6C4 8.2 3 10.6 3 12c0 2.5 4 7 9 7 1.6 0 3-.4 4.2-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          </span>
        </div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:14px;">
      <button style="height:42px;border:none;border-radius:999px;background:{{ accent }};color:oklch(0.99 0.005 80);font-family:'Mulish',sans-serif;font-size:13.5px;font-weight:700;cursor:pointer;">Entrar</button>
      <div style="display:flex;align-items:flex-start;gap:8px;padding:11px 13px;background:oklch(0.94 0.014 78);border-radius:11px;">
        <span style="display:inline-flex;color:oklch(0.48 0.02 55);flex-shrink:0;margin-top:1px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>
        </span>
        <span style="font-size:11.5px;line-height:1.45;color:oklch(0.48 0.02 55);">El acceso solo oculta el panel. Lo que autoriza a publicar es el token del repositorio, que se pide una vez tras entrar.</span>
      </div>
    </div>

    <div style="border-top:1px solid oklch(0.88 0.02 75);padding-top:14px;display:flex;justify-content:center;">
      <a href="#" style="font-size:12.5px;font-weight:700;color:oklch(0.48 0.02 55);display:inline-flex;align-items:center;gap:6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
        Volver al mazo
      </a>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview": {"width": 880, "height": 620}, "accentPalette": {"editor": "enum", "default": "clay", "options": ["clay", "tekhelet"], "tsType": "string", "section": "Estilo"}}'>
class Component extends DCLogic {
  renderVals() {
    const tek = (this.props.accentPalette ?? 'clay') === 'tekhelet';
    return {
      accent: tek ? 'oklch(0.42 0.09 255)' : 'oklch(0.56 0.13 35)',
      accentSoft: tek ? 'oklch(0.9 0.025 255)' : 'oklch(0.9 0.035 40)',
    };
  }
}
</script>
</body>
</html>
